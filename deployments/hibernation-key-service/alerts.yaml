apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hibernation-key-service
spec:
  groups:
    - name: hibernation-key-service
      rules:
        - alert: HibernationKeyServiceUnavailable
          expr: up{job="hibernation-key-service"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Hibernation key service is unreachable
            description: Restore and save transitions are blocked. Check NAS, TLS and the service; do not restart running guests or erase keys.
        - alert: HibernationRegistrationNotReady
          expr: kubevirt_hibernation_registration_ready == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Hibernation client enrollment is not ready
            description: Inspect registration conditions and service-side approval. Requested VM identities and CRD status are not grants.
        - alert: HibernationCertificateRenewalFailed
          expr: kubevirt_hibernation_registration_renewal_failed == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Hibernation client renewal failed
            description: Check CA trust, pinned TPM identity, provider availability and revocation. Preserve the existing node-local key.
        - alert: HibernationServerCertificateExpiring
          expr: hibernation_key_service_server_certificate_expiry_timestamp_seconds - time() < 604800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Hibernation service certificate expires within seven days
            description: Use the root-only administrative renew-server operation and verify a new TLS connection.
        - alert: HibernationTPMUnavailable
          expr: hibernation_key_service_tpm_reachable == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Hibernation service cannot access its TPM
            description: Inspect device permissions and TPM health. Do not initialize over existing objects or move active keys to another TPM.
        - alert: HibernationTPMCapacityLow
          expr: hibernation_key_service_tpm_persistent_slots_available < 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Hibernation TPM persistent capacity is low
            description: Inspect owned attempts and finalize only verified restored guests. Preserve unrelated TPM objects.
        - alert: HibernationAttemptStuck
          expr: hibernation_key_service_stuck_attempt_age_seconds > 1800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Hibernation creation, restore finalization or cleanup is stuck
            description: Inspect attempt ownership and TPM state. Retry verified cleanup; never erase because of a timeout alone.
