---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    kubevirt.io: ""
  name: hibernationkeyregistrations.hibernation.kubevirt.io
spec:
  group: hibernation.kubevirt.io
  names:
    kind: HibernationKeyRegistration
    listKind: HibernationKeyRegistrationList
    plural: hibernationkeyregistrations
    shortNames:
    - hkr
    singular: hibernationkeyregistration
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              endpoint:
                maxLength: 2048
                pattern: ^https://[^/?#@]+$
                type: string
              kernelQualifications:
                items:
                  properties:
                    sourceKernel:
                      maxLength: 128
                      pattern: ^[a-zA-Z0-9][a-zA-Z0-9._+-]*$
                      type: string
                    targetKernel:
                      maxLength: 128
                      pattern: ^[a-zA-Z0-9][a-zA-Z0-9._+-]*$
                      type: string
                    vmUID:
                      maxLength: 128
                      minLength: 1
                      pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]*$
                      type: string
                  required:
                  - vmUID
                  - sourceKernel
                  - targetKernel
                  type: object
                  x-kubernetes-validations:
                  - message: qualification requires different kernels
                    rule: self.sourceKernel != self.targetKernel
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - vmUID
                x-kubernetes-list-type: map
              nodeName:
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: identity is immutable; create a new registration
                  rule: self == oldSelf
              nodeUID:
                maxLength: 128
                minLength: 1
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]*$
                type: string
                x-kubernetes-validations:
                - message: identity is immutable; create a new registration
                  rule: self == oldSelf
              providerID:
                maxLength: 76
                pattern: ^tpm2-sha256-[0-9a-f]{64}$
                type: string
                x-kubernetes-validations:
                - message: identity is immutable; create a new registration
                  rule: self == oldSelf
              requestedVMs:
                items:
                  properties:
                    name:
                      maxLength: 253
                      type: string
                    namespace:
                      maxLength: 63
                      type: string
                    vmUID:
                      maxLength: 128
                      minLength: 1
                      pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]*$
                      type: string
                  required:
                  - vmUID
                  type: object
                maxItems: 128
                type: array
              serverCA:
                maxLength: 32768
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: only public CA certificates may be stored
                  rule: '!self.contains(''PRIVATE KEY'')'
            required:
            - endpoint
            - serverCA
            - providerID
            - nodeName
            - nodeUID
            type: object
          status:
            properties:
              certificateExpiry:
                format: date-time
                type: string
              clientFingerprint:
                maxLength: 64
                type: string
              clusterID:
                maxLength: 128
                minLength: 1
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]*$
                type: string
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    reason:
                      maxLength: 1024
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      enum:
                      - PendingApproval
                      - Registered
                      - Ready
                      - Revoked
                      - Degraded
                      type: string
                  required:
                  - type
                  - status
                  - reason
                  - message
                  - lastTransitionTime
                  type: object
                maxItems: 5
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effectiveGrants:
                items:
                  properties:
                    clusterID:
                      maxLength: 128
                      minLength: 1
                      pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]*$
                      type: string
                    vmUID:
                      maxLength: 128
                      minLength: 1
                      pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]*$
                      type: string
                  required:
                  - clusterID
                  - vmUID
                  type: object
                maxItems: 128
                type: array
              enrollmentRequestID:
                maxLength: 64
                type: string
              nodeUID:
                maxLength: 128
                minLength: 1
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]*$
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
